[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-playlist-transcripts"
version = "0.1.0"
description = "Extract every transcript in a YouTube playlist into clean, timestamped markdown files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mattheogim" }]
keywords = ["youtube", "transcript", "subtitles", "playlist", "yt-dlp", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "yt-dlp>=2026.3.17",
    "webvtt-py>=0.5.1",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    "python-slugify>=8.0",
]

[project.urls]
Repository = "https://github.com/mattheogim/yt-playlist-transcripts"
Issues = "https://github.com/mattheogim/yt-playlist-transcripts/issues"

[project.scripts]
yt-playlist-transcripts = "yt_playlist_transcripts.cli:main"

[tool.setuptools]
packages = ["yt_playlist_transcripts"]
