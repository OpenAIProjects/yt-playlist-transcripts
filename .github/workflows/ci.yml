name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Import smoke test
        run: python -c "import yt_playlist_transcripts; from yt_playlist_transcripts import cli, extract, regen, verify"

      - name: CLI --help smoke test
        run: |
          yt-playlist-transcripts --help
          yt-playlist-transcripts regen --help
          yt-playlist-transcripts verify --help
          python -m yt_playlist_transcripts --help

      - name: Run tests
        run: pytest -q
